<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão | Minimal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .view-section { display: none; }
        .view-section.active { display: block; }
        .nav-btn.active { background-color: #000; color: #fff; }
        /* Ajuste para inputs de número não mostrarem setas em alguns browsers */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-white text-black font-sans">

<div class="min-h-screen flex flex-col md:flex-row">
    <aside class="w-full md:w-64 bg-white border-r border-gray-200 p-6">
        <div class="flex items-center gap-3 mb-10 pb-4 border-b border-gray-100">
            <div class="bg-black text-white p-2 rounded">
                <i class="fas fa-terminal"></i>
            </div>
            <h1 class="text-lg font-bold tracking-tighter uppercase">Sistema Gestão</h1>
        </div>
        
        <nav class="space-y-1">
            <button onclick="switchView('dashboard')" id="btn-dashboard" class="nav-btn active w-full flex items-center gap-3 p-3 rounded-md text-sm font-bold transition">
                <i class="fas fa-list"></i> DASHBOARD
            </button>
            <button onclick="switchView('grafico')" id="btn-grafico" class="nav-btn w-full flex items-center gap-3 p-3 rounded-md text-sm font-bold text-gray-400 hover:text-black transition">
                <i class="fas fa-chart-bar"></i> GRÁFICO
            </button>
            <button onclick="switchView('admin')" id="btn-admin" class="nav-btn w-full flex items-center gap-3 p-3 rounded-md text-sm font-bold text-gray-400 hover:text-black transition">
                <i class="fas fa-cog"></i> CONFIGURAÇÕES
            </button>
        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-10">
        
        <section id="view-dashboard" class="view-section active">
            <header class="mb-8">
                <h2 class="text-2xl font-bold tracking-tight text-black uppercase">Visão Geral</h2>
            </header>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                <div class="border border-black p-5">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Total Registros</p>
                    <span class="text-3xl font-black" id="total-registros">0</span>
                </div>
                <div class="border border-black p-5">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Total SMS</p>
                    <span class="text-3xl font-black" id="total-sms">0</span>
                </div>
                <div class="border border-black p-5">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Total E-mails</p>
                    <span class="text-3xl font-black" id="total-email">0</span>
                </div>
                <div class="border border-black p-5">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Total Cartas</p>
                    <span class="text-3xl font-black" id="total-cartas">0</span>
                </div>
            </div>

            <div class="bg-white border border-gray-200 overflow-x-auto">
                <table class="w-full text-left min-w-[600px]">
                    <thead class="bg-black text-white text-[11px] uppercase tracking-wider">
                        <tr>
                            <th class="p-4 font-bold">Empresa</th>
                            <th class="p-4 font-bold text-center">Registros</th>
                            <th class="p-4 font-bold text-center">SMS</th>
                            <th class="p-4 font-bold text-center">E-mail</th>
                            <th class="p-4 font-bold text-center">Cartas</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-dashboard" class="divide-y divide-gray-200 text-sm">
                        </tbody>
                </table>
            </div>
        </section>

        <section id="view-grafico" class="view-section">
            <header class="mb-8 text-center md:text-left">
                <h2 class="text-2xl font-bold tracking-tight uppercase">Performance por Canal</h2>
            </header>
            <div class="bg-white border border-gray-200 p-6 h-[500px]">
                <canvas id="myChart"></canvas>
            </div>
        </section>

        <section id="view-admin" class="view-section">
            <div id="auth-container" class="max-w-sm mx-auto mt-10">
                <div class="border border-black p-8 text-center">
                    <h3 class="font-bold mb-6 uppercase text-xs tracking-widest">Acesso Restrito</h3>
                    <input type="password" id="pass-input" placeholder="CÓDIGO DE ACESSO" class="w-full p-3 mb-6 border border-gray-300 text-center focus:border-black outline-none font-mono">
                    <button onclick="checkPass()" class="w-full bg-black text-white p-3 font-bold text-xs hover:bg-gray-800 transition">ENTRAR</button>
                </div>
            </div>

            <div id="panel-container" class="hidden">
                <div class="flex justify-between items-center mb-8 pb-4 border-b border-gray-200">
                    <h2 class="text-xl font-bold uppercase tracking-tighter">Lançamentos de Produção</h2>
                    <button onclick="logout()" class="text-xs font-bold text-gray-400 hover:text-black">LOGOUT</button>
                </div>

                <div class="bg-gray-50 p-6 border border-gray-200 mb-8">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">
                        <input type="text" id="input-empresa" placeholder="EMPRESA" class="p-3 border bg-white outline-none text-xs font-bold uppercase">
                        <input type="number" id="input-registros" placeholder="REGISTROS" min="0" class="p-3 border bg-white outline-none text-xs font-bold">
                        <input type="number" id="input-sms" placeholder="SMS" min="0" class="p-3 border bg-white outline-none text-xs font-bold">
                        <input type="number" id="input-email" placeholder="E-MAIL" min="0" class="p-3 border bg-white outline-none text-xs font-bold">
                        <input type="number" id="input-carta" placeholder="CARTAS" min="0" class="p-3 border bg-white outline-none text-xs font-bold">
                        <button onclick="salvarDados()" class="bg-black text-white p-3 font-bold text-[10px] uppercase hover:bg-gray-800 transition">Gravar</button>
                    </div>
                </div>

                <div class="border border-gray-200 overflow-hidden text-sm">
                    <table class="w-full text-left">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="p-4 font-bold uppercase text-[10px] tracking-widest">Empresa</th>
                                <th class="p-4 font-bold text-right uppercase text-[10px] tracking-widest">Gestão</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-admin" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCzIG5TaDEH2R-f7GtJRiTi_Jxt1aiPiqY", 
        authDomain: "camec-6a988.firebaseapp.com",
        projectId: "camec-6a988",
        storageBucket: "camec-6a988.appspot.com",
        messagingSenderId: "37119733437",
        appId: "1:37119733437:web:49241324e93e303e30a5d2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let myChart = null;

    // --- Navegação ---
    window.switchView = (viewId) => {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'bg-black', 'text-white'));
        
        document.getElementById(`view-${viewId}`).classList.add('active');
        document.getElementById(`btn-${viewId}`).classList.add('active');
    };

    // --- Login ---
    window.checkPass = () => {
        if(document.getElementById('pass-input').value === '1234') {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('panel-container').classList.remove('hidden');
        } else {
            Swal.fire({ icon: 'error', title: 'Inválido' });
        }
    };

    window.logout = () => {
        document.getElementById('auth-container').classList.remove('hidden');
        document.getElementById('panel-container').classList.add('hidden');
        document.getElementById('pass-input').value = '';
    };

    // --- Dados (Com Métrica Carta) ---
    window.salvarDados = async () => {
        const nome = document.getElementById('input-empresa').value.trim().toUpperCase();
        const reg = parseInt(document.getElementById('input-registros').value) || 0;
        const sms = parseInt(document.getElementById('input-sms').value) || 0;
        const eml = parseInt(document.getElementById('input-email').value) || 0;
        const crt = parseInt(document.getElementById('input-carta').value) || 0;

        if(!nome) return Swal.fire('Aviso', 'Nome da empresa obrigatório', 'warning');

        try {
            await setDoc(doc(db, "empresas", nome), { 
                nome, 
                registros: increment(reg),
                sms: increment(sms),
                email: increment(eml),
                cartas: increment(crt)
            }, { merge: true });

            document.querySelectorAll('#panel-container input').forEach(i => i.value = '');
            Swal.fire({ icon: 'success', title: 'Lançado', timer: 800, showConfirmButton: false });
        } catch (e) {
            Swal.fire('Erro', 'Falha na gravação', 'error');
        }
    };

    window.excluir = async (id) => {
        const res = await Swal.fire({ title: 'Excluir ' + id + '?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#000' });
        if (res.isConfirmed) await deleteDoc(doc(db, "empresas", id));
    };

    // --- Realtime Sync ---
    onSnapshot(collection(db, "empresas"), (snapshot) => {
        const empresas = [];
        snapshot.forEach(doc => empresas.push(doc.data()));
        
        // Atualiza Totais nos Cards
        document.getElementById('total-registros').innerText = empresas.reduce((s, e) => s + (e.registros || 0), 0);
        document.getElementById('total-sms').innerText = empresas.reduce((s, e) => s + (e.sms || 0), 0);
        document.getElementById('total-email').innerText = empresas.reduce((s, e) => s + (e.email || 0), 0);
        document.getElementById('total-cartas').innerText = empresas.reduce((s, e) => s + (e.cartas || 0), 0);

        // Tabela Dashboard
        const tabDash = document.getElementById('tabela-dashboard');
        tabDash.innerHTML = empresas.map(emp => `
            <tr class="hover:bg-gray-50 transition">
                <td class="p-4 font-black text-black uppercase tracking-tighter">${emp.nome}</td>
                <td class="p-4 text-center font-mono text-gray-500">${emp.registros || 0}</td>
                <td class="p-4 text-center font-mono text-gray-500">${emp.sms || 0}</td>
                <td class="p-4 text-center font-mono text-gray-500">${emp.email || 0}</td>
                <td class="p-4 text-center font-mono text-gray-500">${emp.cartas || 0}</td>
            </tr>
        `).join('');

        // Tabela Admin (Lista simplificada para exclusão)
        document.getElementById('tabela-admin').innerHTML = empresas.map(emp => `
            <tr>
                <td class="p-4 font-bold text-gray-600 uppercase text-[11px]">${emp.nome}</td>
                <td class="p-4 text-right">
                    <button onclick="excluir('${emp.nome}')" class="text-gray-300 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                </td>
            </tr>
        `).join('');

        updateChart(empresas);
    });

    // --- Gráfico com 4 Barras por Empresa ---
    function updateChart(dados) {
        const ctx = document.getElementById('myChart').getContext('2d');
        const labels = dados.map(d => d.nome);
        
        const config = {
            labels: labels,
            datasets: [
                { label: 'REGISTROS', data: dados.map(d => d.registros), backgroundColor: '#000' },
                { label: 'SMS', data: dados.map(d => d.sms), backgroundColor: '#444' },
                { label: 'E-MAIL', data: dados.map(d => d.email), backgroundColor: '#888' },
                { label: 'CARTAS', data: dados.map(d => d.cartas), backgroundColor: '#CCC' }
            ]
        };

        if (!myChart) {
            myChart = new Chart(ctx, {
                type: 'bar',
                data: config,
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { font: { size: 10, weight: 'bold' } } } },
                    scales: { y: { beginAtZero: true, grid: { color: '#f0f0f0' } }, x: { grid: { display: false } } }
                }
            });
        } else {
            myChart.data.labels = labels;
            myChart.data.datasets[0].data = dados.map(d => d.registros);
            myChart.data.datasets[1].data = dados.map(d => d.sms);
            myChart.data.datasets[2].data = dados.map(d => d.email);
            myChart.data.datasets[3].data = dados.map(d => d.cartas);
            myChart.update();
        }
    }
</script>
</body>
</html>
