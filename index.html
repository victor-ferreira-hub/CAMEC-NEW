<script type="module">
    // 1. Importando as ferramentas do Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 2. CONFIGURAÇÃO DO SEU PROJETO (COPIE DO SEU PAINEL FIREBASE)
    const firebaseConfig = {
        apiKey: "COLE_AQUI_SUA_API_KEY",
        authDomain: "camec-6a988.firebaseapp.com",
        projectId: "camec-6a988",
        storageBucket: "camec-6a988.appspot.com",
        messagingSenderId: "COLE_AQUI",
        appId: "COLE_AQUI"
    };

    // Inicializa o Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let myChart = null;

    // --- FUNÇÕES DO SISTEMA ---

    // Alternar entre Dashboard e Admin
    window.switchView = function(view) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
        document.getElementById('btn-' + view).classList.add('active');
        if(view === 'dashboard') atualizarDashboard();
    }

    // Login Simples
    window.checkPass = function() {
        const pass = document.getElementById('pass-input').value;
        if(pass === '1234') { 
            document.getElementById('admin-auth').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            ouvirDados(); // Começa a ler o banco em tempo real
        } else {
            alert("Senha incorreta!");
        }
    }

    // SALVAR NO FIREBASE (Substitui o LocalStorage)
    window.salvarDados = async function() {
        const nome = document.getElementById('input-empresa').value.trim().toUpperCase();
        const qtd = parseInt(document.getElementById('input-registros').value);

        if(!nome || isNaN(qtd)) return alert("Preencha corretamente!");

        try {
            // No Firebase, usamos o nome da empresa como ID para somar automático
            const docRef = doc(db, "empresas", nome);
            const querySnapshot = await getDocs(collection(db, "empresas"));
            let totalAtual = 0;

            querySnapshot.forEach((d) => {
                if(d.id === nome) totalAtual = d.data().total;
            });

            await setDoc(docRef, {
                nome: nome,
                total: totalAtual + qtd
            });

            document.getElementById('input-empresa').value = '';
            document.getElementById('input-registros').value = '';
            alert("Lançado com sucesso no Banco de Dados!");
        } catch (e) {
            console.error("Erro ao salvar:", e);
        }
    }

    // LER DADOS EM TEMPO REAL (Isso faz o site atualizar sozinho para todos)
    function ouvirDados() {
        onSnapshot(collection(db, "empresas"), (snapshot) => {
            const empresas = [];
            snapshot.forEach((doc) => empresas.push(doc.data()));
            renderizarTabela(empresas);
            window.dadosAtuais = empresas; // Guarda para o Dashboard
        });
    }

    function renderizarTabela(empresas) {
        const corpo = document.getElementById('tabela-corpo');
        corpo.innerHTML = '';
        empresas.forEach((emp) => {
            corpo.innerHTML += `
                <tr>
                    <td><strong>${emp.nome}</strong></td>
                    <td>${emp.total}</td>
                    <td><button class="btn-del" onclick="excluir('${emp.nome}')">Zerar/Excluir</button></td>
                </tr>
            `;
        });
    }

    window.excluir = async function(nome) {
        if(confirm("Deseja remover esta empresa?")) {
            await deleteDoc(doc(db, "empresas", nome));
        }
    }

    window.atualizarDashboard = async function() {
        const querySnapshot = await getDocs(collection(db, "empresas"));
        const empresas = [];
        querySnapshot.forEach((doc) => empresas.push(doc.data()));

        const totalGeral = empresas.reduce((sum, emp) => sum + emp.total, 0);
        document.getElementById('total-geral').innerText = totalGeral;
        document.getElementById('total-empresas').innerText = empresas.length;

        const ctx = document.getElementById('myChart').getContext('2d');
        if(myChart) myChart.destroy();
        
        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: empresas.map(e => e.nome),
                datasets: [{
                    label: 'Registros por Empresa',
                    data: empresas.map(e => e.total),
                    backgroundColor: '#2ecc71'
                }]
            },
            options: { responsive: true }
        });
    }

    // Iniciar Dashboard ao carregar
    atualizarDashboard();
</script>
