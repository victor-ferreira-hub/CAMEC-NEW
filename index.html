<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMEC | Gestão Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

<div class="min-h-screen flex flex-col md:flex-row">
    <aside class="w-full md:w-64 bg-slate-900 text-white p-6 shadow-xl">
        <div class="flex items-center gap-3 mb-10">
            <div class="bg-emerald-500 p-2 rounded-lg"><i class="fas fa-layer-group text-xl"></i></div>
            <h1 class="text-xl font-bold uppercase tracking-wider">Camec System</h1>
        </div>
        
        <nav class="space-y-2">
            <button onclick="switchView('dashboard')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl bg-emerald-600">
                <i class="fas fa-chart-pie"></i> Dashboard
            </button>
            <button onclick="switchView('admin')" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-800 text-slate-400">
                <i class="fas fa-user-shield"></i> Administração
            </button>
        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-10">
        <section id="view-dashboard" class="view-section active">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-400 text-sm font-bold uppercase">Volume Total Mensal</p>
                    <h2 class="text-4xl font-black text-slate-900" id="total-geral">0</h2>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-400 text-sm font-bold uppercase">Empresas Monitoradas</p>
                    <h2 class="text-4xl font-black text-slate-900" id="total-empresas">0</h2>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-96">
                <canvas id="myChart"></canvas>
            </div>
        </section>

        <section id="view-admin" class="view-section">
            <div id="auth-container" class="max-w-sm mx-auto mt-10">
                <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
                    <h3 class="text-xl font-bold mb-4">Acesso Restrito</h3>
                    <input type="email" id="login-email" placeholder="E-mail" class="w-full p-3 mb-3 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                    <input type="password" id="login-pass" placeholder="Senha" class="w-full p-3 mb-6 border rounded-lg outline-none focus:ring-2 focus:ring-emerald-500">
                    <button onclick="login()" class="w-full bg-slate-900 text-white p-3 rounded-lg font-bold">Entrar</button>
                </div>
            </div>

            <div id="panel-container" class="hidden">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-bold">Gerenciar Lançamentos</h2>
                    <button onclick="logout()" class="text-red-500 font-medium hover:underline">Sair do Sistema</button>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="input-empresa" placeholder="Empresa" class="p-3 border rounded-xl">
                    <input type="number" id="input-registros" placeholder="Qtd" min="1" class="p-3 border rounded-xl">
                    <button onclick="salvarDados()" class="bg-emerald-500 text-white font-bold rounded-xl hover:bg-emerald-600 transition">Lançar Agora</button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-bottom border-slate-100">
                            <tr>
                                <th class="p-4 font-bold text-slate-500">CLIENTE</th>
                                <th class="p-4 font-bold text-slate-500 text-center">TOTAL</th>
                                <th class="p-4 font-bold text-slate-500 text-right">AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Configuração do seu Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCzIG5TaDEH2R-f7GtJRiTi_Jxt1aiPiqY", 
        authDomain: "camec-6a988.firebaseapp.com",
        projectId: "camec-6a988",
        storageBucket: "camec-6a988.appspot.com",
        messagingSenderId: "37119733437",
        appId: "1:37119733437:web:49241324e93e303e30a5d2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let myChart = null;

    // --- Lógica de Navegação ---
    window.switchView = (viewId) => {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.getElementById(`view-${viewId}`).classList.add('active');
    };

    // --- Lógica de Autenticação Real ---
    window.login = async () => {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
            Swal.fire('Bem-vindo!', 'Acesso autorizado.', 'success');
        } catch (e) {
            Swal.fire('Erro', 'Credenciais inválidas!', 'error');
        }
    };

    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        const authDiv = document.getElementById('auth-container');
        const panelDiv = document.getElementById('panel-container');
        if (user) {
            authDiv.classList.add('hidden');
            panelDiv.classList.remove('hidden');
        } else {
            authDiv.classList.remove('hidden');
            panelDiv.classList.add('hidden');
        }
    });

    // --- Lógica de Dados (Otimizada) ---
    window.salvarDados = async () => {
        const nome = document.getElementById('input-empresa').value.trim().toUpperCase();
        const qtd = parseInt(document.getElementById('input-registros').value);

        if(!nome || isNaN(qtd) || qtd <= 0) return Swal.fire('Ops!', 'Preencha valores válidos.', 'warning');

        Swal.fire({ title: 'Processando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            const docRef = doc(db, "empresas", nome);
            // Uso de increment() -> Operação atômica e performática
            await setDoc(docRef, { 
                nome: nome, 
                total: increment(qtd) 
            }, { merge: true });

            document.getElementById('input-empresa').value = '';
            document.getElementById('input-registros').value = '';
            Swal.close();
        } catch (e) {
            Swal.fire('Erro', 'Você tem permissão para gravar?', 'error');
        }
    };

    window.excluir = async (id) => {
        const result = await Swal.fire({
            title: 'Confirmar exclusão?',
            text: "Os dados da empresa serão removidos permanentemente.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#10b981',
            confirmButtonText: 'Sim, excluir'
        });

        if (result.isConfirmed) {
            await deleteDoc(doc(db, "empresas", id));
            Swal.fire('Excluído!', '', 'success');
        }
    };

    // --- Monitoramento e Gráfico (Update Inteligente) ---
    onSnapshot(collection(db, "empresas"), (snapshot) => {
        const empresas = [];
        snapshot.forEach(doc => empresas.push(doc.data()));
        
        // UI Updates
        document.getElementById('total-geral').innerText = empresas.reduce((s, e) => s + e.total, 0);
        document.getElementById('total-empresas').innerText = empresas.length;

        // Tabela
        const corpo = document.getElementById('tabela-corpo');
        corpo.innerHTML = empresas.map(emp => `
            <tr class="hover:bg-slate-50 transition">
                <td class="p-4 font-bold text-slate-700">${emp.nome}</td>
                <td class="p-4 text-center font-mono font-bold">${emp.total}</td>
                <td class="p-4 text-right">
                    <button onclick="excluir('${emp.nome}')" class="text-red-400 hover:text-red-600 px-3"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `).join('');

        // Gráfico (Update em vez de destroy)
        updateChart(empresas);
    });

    function updateChart(dados) {
        const ctx = document.getElementById('myChart').getContext('2d');
        const labels = dados.map(d => d.nome);
        const valores = dados.map(d => d.total);

        if (!myChart) {
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Registros', data: valores, backgroundColor: '#10b981', borderRadius: 10 }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        } else {
            myChart.data.labels = labels;
            myChart.data.datasets[0].data = valores;
            myChart.update();
        }
    }
</script>
</body>
</html>
