<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMEC | Gestão de Produção</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
.view-section{display:none}
.view-section.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.nav-btn.active{background:#000;color:#fff;border-radius:4px}
.loader{border:2px solid #f3f3f3;border-top:2px solid #fff;border-radius:50%;width:14px;height:14px;animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
</style>
</head>

<body class="bg-white text-black font-sans">

<div class="min-h-screen flex">
<aside class="w-64 border-r p-6 flex flex-col">
<div class="bg-black text-white px-4 py-2 text-2xl font-black mb-8">CAMEC</div>

<nav class="space-y-1 flex-1">
<button id="btn-dashboard" class="nav-btn active w-full p-3 font-black text-xs flex gap-2"><i class="fas fa-chart-pie"></i> Dashboard</button>
<button id="btn-grafico" class="nav-btn w-full p-3 font-black text-xs flex gap-2 text-gray-400"><i class="fas fa-chart-bar"></i> Gráfico</button>
<button id="btn-admin" class="nav-btn w-full p-3 font-black text-xs flex gap-2 text-gray-400"><i class="fas fa-lock"></i> Admin</button>
</nav>

<div id="user-status" class="text-[10px] font-bold text-gray-400 hidden">
Logado: <span id="user-email" class="text-black"></span>
</div>
</aside>

<main class="flex-1 p-10 overflow-y-auto">

<!-- DASHBOARD -->
<section id="view-dashboard" class="view-section active">
<h2 class="text-3xl font-black mb-6">Dashboard</h2>

<div class="grid grid-cols-4 gap-4 mb-8">
<div class="border p-4"><p class="text-xs text-gray-400">Registros</p><span id="total-registros" class="text-2xl font-black">0</span></div>
<div class="border p-4"><p class="text-xs text-gray-400">SMS</p><span id="total-sms" class="text-2xl font-black">0</span></div>
<div class="border p-4"><p class="text-xs text-gray-400">Email</p><span id="total-email" class="text-2xl font-black">0</span></div>
<div class="border p-4"><p class="text-xs text-gray-400">Cartas</p><span id="total-cartas" class="text-2xl font-black">0</span></div>
</div>

<table class="w-full border">
<thead class="bg-black text-white text-xs">
<tr>
<th class="p-3 text-left">Empresa</th>
<th class="p-3 text-center">Registros</th>
<th class="p-3 text-center">SMS</th>
<th class="p-3 text-center">Email</th>
<th class="p-3 text-center">Cartas</th>
</tr>
</thead>
<tbody id="tabela-dashboard"></tbody>
</table>
</section>

<!-- GRÁFICO -->
<section id="view-grafico" class="view-section">
<h2 class="text-2xl font-black mb-6">Top 10 Produção</h2>
<div class="h-[500px] border p-4">
<canvas id="myChart"></canvas>
</div>
</section>

<!-- ADMIN -->
<section id="view-admin" class="view-section">

<div id="auth-container" class="max-w-sm mx-auto">
<input id="login-email" type="email" placeholder="Email" class="border p-3 w-full mb-2">
<input id="login-pass" type="password" placeholder="Senha" class="border p-3 w-full mb-4">
<button id="btn-login" class="bg-black text-white w-full p-3 font-black">ENTRAR</button>
</div>

<div id="panel-container" class="hidden">
<button id="btn-logout" class="text-red-500 text-xs mb-4">Sair</button>

<input id="input-empresa" placeholder="Empresa" class="border p-3 w-full mb-2">
<div class="grid grid-cols-4 gap-2">
<input id="input-registros" type="number" value="0" class="border p-2">
<input id="input-sms" type="number" value="0" class="border p-2">
<input id="input-email" type="number" value="0" class="border p-2">
<input id="input-carta" type="number" value="0" class="border p-2">
</div>

<button id="btn-confirmar" class="bg-black text-white w-full p-3 mt-4 font-black flex justify-center gap-2">
<span class="btn-text">Salvar</span>
<div class="loader hidden"></div>
</button>

<table class="w-full mt-6 text-xs">
<tbody id="tabela-admin"></tbody>
</table>
</div>

</section>

</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy, limit, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
 apiKey: "SUA_API_KEY",
 authDomain: "SEU_DOMINIO",
 projectId: "SEU_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
let myChart;

/* NAVEGAÇÃO */
['dashboard','grafico','admin'].forEach(v=>{
 $('btn-'+v).onclick=()=>switchView(v);
});
function switchView(v){
 document.querySelectorAll('.view-section').forEach(s=>s.classList.remove('active'));
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
 $('view-'+v).classList.add('active');
 $('btn-'+v).classList.add('active');
}

/* LOGIN */
$('btn-login').onclick=()=>signInWithEmailAndPassword(auth,$('login-email').value,$('login-pass').value);
$('btn-logout').onclick=()=>signOut(auth);

onAuthStateChanged(auth,u=>{
 $('auth-container').classList.toggle('hidden',!!u);
 $('panel-container').classList.toggle('hidden',!u);
 if(u){$('user-status').classList.remove('hidden');$('user-email').innerText=u.email;}
});

/* SALVAR */
$('btn-confirmar').onclick=async()=>{
 const nome=$('input-empresa').value.trim().toUpperCase();
 if(!nome) return Swal.fire('Erro','Empresa obrigatória','warning');

 await setDoc(doc(db,'empresas',nome),{
  nome,
  registros:increment(+$('input-registros').value||0),
  sms:increment(+$('input-sms').value||0),
  email:increment(+$('input-email').value||0),
  cartas:increment(+$('input-carta').value||0)
 },{merge:true});

 Swal.fire('OK','Salvo','success');
};

/* SNAPSHOT OTIMIZADO */
const q=query(collection(db,'empresas'),orderBy('registros','desc'),limit(10));
onSnapshot(q,snap=>{
 const dados=[];
 snap.forEach(d=>dados.push(d.data()));

 $('tabela-dashboard').innerHTML=dados.map(e=>`
 <tr>
  <td class="p-2">${e.nome}</td>
  <td class="p-2 text-center">${e.registros||0}</td>
  <td class="p-2 text-center">${e.sms||0}</td>
  <td class="p-2 text-center">${e.email||0}</td>
  <td class="p-2 text-center">${e.cartas||0}</td>
 </tr>`).join('');

 updateChart(dados);
});

/* GRÁFICO */
function updateChart(d){
 const ctx=$('myChart');
 if(!myChart){
  myChart=new Chart(ctx,{
   type:'bar',
   data:{labels:d.map(i=>i.nome),datasets:[
    {label:'Registros',data:d.map(i=>i.registros||0),backgroundColor:'#000'},
    {label:'SMS',data:d.map(i=>i.sms||0),backgroundColor:'#9ca3af'}
   ]},
   options:{responsive:true,maintainAspectRatio:false}
  });
 }else{
  myChart.data.labels=d.map(i=>i.nome);
  myChart.data.datasets[0].data=d.map(i=>i.registros||0);
  myChart.data.datasets[1].data=d.map(i=>i.sms||0);
  myChart.update();
 }
}
</script>
</body>
</html>
