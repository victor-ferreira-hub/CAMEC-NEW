<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMEC | Gestão de Produção</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white text-black font-sans antialiased">

<div class="min-h-screen flex flex-col md:flex-row">
    <aside class="w-full md:w-64 bg-white border-r border-gray-100 p-6 flex flex-col">
        <div class="flex items-center gap-3 mb-10 pb-4 border-b border-gray-100">
            <div class="brand-logo">CAMEC</div>
        </div>
        <nav class="space-y-1 flex-1" id="main-nav">
            <button data-view="dashboard" class="nav-btn active">
                <i class="fas fa-chart-pie"></i> Visão Geral
            </button>
            <button data-view="grafico" class="nav-btn">
                <i class="fas fa-chart-bar"></i> Gráfico Top 10
            </button>
            <button data-view="admin" class="nav-btn">
                <i class="fas fa-lock"></i> Administração
            </button>
        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-12">
        <section id="view-dashboard" class="view-section active">
            <header class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-black uppercase">Dashboard</h2>
                <span class="status-badge">Atualizado em Tempo Real</span>
            </header>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                <div class="stat-card">
                    <p>Registros</p><span id="total-registros">0</span>
                </div>
                <div class="stat-card">
                    <p>SMS</p><span id="total-sms">0</span>
                </div>
                <div class="stat-card">
                    <p>E-mail</p><span id="total-email">0</span>
                </div>
                <div class="stat-card">
                    <p>Cartas</p><span id="total-cartas">0</span>
                </div>
            </div>

            <div class="table-container">
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th>Empresa</th>
                            <th class="text-center">Registros</th>
                            <th class="text-center">SMS</th>
                            <th class="text-center">E-mail</th>
                            <th class="text-center">Cartas</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-dashboard"></tbody>
                </table>
            </div>
        </section>

        <section id="view-grafico" class="view-section">
            <h2 class="text-2xl font-black uppercase mb-8">Análise de Performance</h2>
            <div class="chart-wrapper">
                <canvas id="myChart"></canvas>
            </div>
        </section>

        <section id="view-admin" class="view-section">
            <div id="auth-container" class="max-w-md mx-auto mt-10">
                <div class="login-card">
                    <h3 class="font-black text-sm uppercase mb-6 text-center tracking-widest">Acesso Camec</h3>
                    <input type="email" id="login-email" placeholder="E-MAIL" class="input-field">
                    <input type="password" id="login-pass" placeholder="SENHA" class="input-field">
                    <button id="btn-login" class="btn-primary">ENTRAR</button>
                </div>
            </div>

            <div id="panel-container" class="hidden">
                <div class="flex justify-between items-center mb-8 pb-4 border-b">
                    <h2 class="text-xl font-black uppercase italic">Lançar Produção</h2>
                    <button id="btn-logout" class="text-[9px] font-bold text-gray-400 hover:text-black">LOGOUT</button>
                </div>

                <div class="form-card">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4">
                        <div class="lg:col-span-2">
                            <label>Empresa</label>
                            <input list="lista-empresas" id="input-empresa" placeholder="NOME" class="input-field">
                            <datalist id="lista-empresas"></datalist>
                        </div>
                        <div><label>Registros</label><input type="number" id="input-registros" value="0" class="input-field"></div>
                        <div><label>SMS</label><input type="number" id="input-sms" value="0" class="input-field"></div>
                        <div><label>E-mail</label><input type="number" id="input-email" value="0" class="input-field"></div>
                        <div><label>Cartas</label><input type="number" id="input-carta" value="0" class="input-field"></div>
                    </div>
                    <button id="btn-confirmar" class="btn-primary mt-6">
                        <span>Confirmar Lançamento</span>
                        <div id="btn-loader" class="loader hidden"></div>
                    </button>
                </div>

                <div class="table-container mt-10">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr>
                                <th class="p-4">Empresa Cadastrada</th>
                                <th class="p-4 text-right">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-admin"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
