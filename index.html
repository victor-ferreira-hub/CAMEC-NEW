<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMEC | BI Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        camec: {
                            gold: '#a16d2a',
                            brown: '#3d2b1f',
                            bg: '#f8f9fa'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Public Sans', sans-serif; background-color: #f8f9fa; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .nav-btn.active { background-color: #a16d2a; color: white !important; }
        .highlight-row { background-color: rgba(34, 197, 94, 0.05) !important; border-left: 4px solid #22c55e; }
    </style>
</head>
<body class="text-slate-700">

<div class="min-h-screen flex">
    <aside class="w-64 bg-white border-r border-gray-100 flex flex-col shrink-0">
        <div class="p-8">
            <h1 class="text-2xl font-black text-camec-gold tracking-tighter mb-10">CAMEC</h1>
            <nav class="space-y-1">
                <button onclick="switchView('dashboard')" id="btn-dashboard" class="nav-btn active w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-400">
                    <i class="fas fa-chart-line"></i> Dashboard
                </button>
                <button onclick="switchView('admin')" id="btn-admin" class="nav-btn w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-400">
                    <i class="fas fa-cog"></i> Administração
                </button>
            </nav>
        </div>
    </aside>

    <main class="flex-1 flex flex-col max-h-screen overflow-hidden">
        <header class="h-20 bg-white border-b flex items-center justify-between px-10">
            <div>
                <h2 class="text-xl font-bold text-camec-brown">Dashboard de Produção</h2>
                <div class="flex items-center gap-2 text-xs font-bold text-camec-gold">
                    <i class="fas fa-calendar-day"></i> <span id="header-mes-atual">AGUARDANDO...</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" id="search-input" onkeyup="renderizarDashboard()" placeholder="Filtrar empresa..." class="pl-9 pr-4 py-2 text-xs border border-gray-100 rounded-lg outline-none focus:ring-1 ring-camec-gold w-64">
                </div>
                <select id="filtro-mes" onchange="renderizarDashboard()" class="text-xs font-bold px-4 py-2 bg-gray-50 border rounded-lg outline-none"></select>
                <div class="flex bg-camec-brown rounded-lg overflow-hidden shadow-sm">
                    <button onclick="exportToPDF()" class="px-4 py-2 text-white text-[10px] font-bold border-r border-white/10 hover:bg-black/20"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button onclick="exportToExcel()" class="px-4 py-2 text-white text-[10px] font-bold hover:bg-black/20"><i class="fas fa-file-excel"></i> EXCEL</button>
                </div>
            </div>
        </header>

        <div class="p-10 overflow-y-auto">
            <section id="view-dashboard" class="view-section active">
                <div class="grid grid-cols-5 gap-4 mb-8">
                    <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm relative">
                        <span class="text-[9px] font-bold text-gray-400 uppercase">Registros</span>
                        <h3 class="text-2xl font-black text-camec-brown" id="total-registros">0</h3>
                        <div id="comp-registros" class="text-[10px] font-bold mt-1"></div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                        <span class="text-[9px] font-bold text-gray-400 uppercase">SMS</span>
                        <h3 class="text-2xl font-black text-camec-brown" id="total-sms">0</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                        <span class="text-[9px] font-bold text-gray-400 uppercase">E-mails</span>
                        <h3 class="text-2xl font-black text-camec-brown" id="total-email">0</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                        <span class="text-[9px] font-bold text-gray-400 uppercase">WhatsApp</span>
                        <h3 class="text-2xl font-black text-green-600" id="total-whatsapp">0</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-gray-100 shadow-sm">
                        <span class="text-[9px] font-bold text-gray-400 uppercase">Cartas</span>
                        <h3 class="text-2xl font-black text-camec-brown" id="total-cartas">0</h3>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-6 mb-8">
                    <div class="col-span-2 bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                        <h4 class="text-[10px] font-bold uppercase mb-6 text-gray-400">Distribuição por Canal</h4>
                        <div class="h-64"><canvas id="chartPrincipal"></canvas></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                        <h4 class="text-[10px] font-bold uppercase mb-6 text-gray-400">🏆 Top 5 Performance</h4>
                        <div id="ranking-list" class="space-y-4"></div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                    <table class="w-full text-left" id="main-table">
                        <thead class="bg-gray-50 border-b border-gray-100">
                            <tr>
                                <th class="px-8 py-4 text-[10px] font-bold uppercase text-gray-400">Empresa</th>
                                <th class="px-6 py-4 text-center text-[10px] font-bold uppercase text-gray-400">Registros</th>
                                <th class="px-6 py-4 text-center text-[10px] font-bold uppercase text-gray-400">SMS</th>
                                <th class="px-6 py-4 text-center text-[10px] font-bold uppercase text-gray-400">WhatsApp</th>
                                <th class="px-6 py-4 text-center text-[10px] font-bold uppercase text-gray-400">E-mail</th>
                                <th class="px-8 py-4 text-right text-[10px] font-bold uppercase text-gray-400">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo" class="text-[12px] divide-y divide-gray-50"></tbody>
                    </table>
                </div>
            </section>

            <section id="view-admin" class="view-section">
                <div id="auth-box" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl border border-gray-100 text-center">
                    <h3 class="font-bold mb-4">Acesso Administrativo</h3>
                    <input type="password" id="admin-pass" class="w-full p-3 bg-gray-50 rounded-lg mb-4 text-center outline-none focus:ring-1 ring-camec-gold" placeholder="••••••••">
                    <button onclick="checkAuth()" class="w-full bg-camec-brown text-white py-3 rounded-lg font-bold">Entrar</button>
                </div>

                <div id="admin-panel" class="hidden max-w-4xl mx-auto space-y-6">
                    <div class="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
                        <h2 id="form-title" class="text-sm font-bold uppercase mb-6 text-camec-gold">Novo Lançamento</h2>
                        <input type="hidden" id="edit-id">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="in-empresa" placeholder="NOME DA EMPRESA" class="w-full p-3 bg-gray-50 rounded-lg outline-none uppercase font-bold text-xs border focus:border-camec-gold">
                            <select id="in-mes" class="w-full p-3 bg-gray-50 rounded-lg outline-none font-bold text-xs border"></select>
                            <input type="number" id="in-registros" placeholder="TOTAL REGISTROS" class="p-3 bg-gray-50 rounded-lg outline-none border text-xs">
                            <div class="grid grid-cols-4 gap-2 col-span-2">
                                <input type="number" id="in-sms" placeholder="SMS" class="p-3 bg-gray-100 rounded-lg outline-none text-xs">
                                <input type="number" id="in-email" placeholder="EMAIL" class="p-3 bg-gray-100 rounded-lg outline-none text-xs">
                                <input type="number" id="in-wpp" placeholder="WPP" class="p-3 bg-gray-100 rounded-lg outline-none text-xs">
                                <input type="number" id="in-cartas" placeholder="CARTAS" class="p-3 bg-gray-100 rounded-lg outline-none text-xs">
                            </div>
                            <div class="col-span-2 flex gap-2">
                                <button onclick="salvar()" id="btn-salvar" class="flex-1 bg-camec-gold text-white py-4 rounded-xl font-bold uppercase hover:opacity-90">Gravar Dados</button>
                                <button onclick="cancelarEdicao()" id="btn-cancel" class="hidden bg-gray-200 text-gray-500 px-6 py-4 rounded-xl font-bold uppercase">Cancelar</button>
                            </div>
                        </div>
                    </div>
                    <div id="admin-list" class="space-y-2 max-h-80 overflow-y-auto"></div>
                </div>
            </section>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDyO3dZbTLg-BabfpDze2a2U9AGUMAB5_o", 
        authDomain: "ccamec-77a76.firebaseapp.com",
        projectId: "camec-77a76",
        storageBucket: "camec-77a76.firebasestorage.app",
        messagingSenderId: "597868183808",
        appId: "1:597868183808:web:00dbbfdf7e87bfdabff3e5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let masterData = [];
    let myChart = null;

    // Normalização: Valor no código (ID) vs Nome na tela
    const PERIODOS = ["NOVEMBRO_2025", "DEZEMBRO_2025", "JANEIRO_2026", "FEVEREIRO_2026", "MARCO_2026", "ABRIL_2026"];

    window.switchView = (v) => {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`view-${v}`).classList.add('active');
        document.getElementById(`btn-${v}`).classList.add('active');
    };

    window.checkAuth = () => {
        if(document.getElementById('admin-pass').value === 'wuwg62Adm1n;') {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
        } else { Swal.fire('Erro', 'Senha inválida', 'error'); }
    };

    // Helper para exibir o mês corretamente
    const formatarMesDisplay = (stringMes) => {
        return stringMes.replace('_', ' ').replace('MARCO', 'MARÇO');
    };

    window.renderizarDashboard = () => {
        const mesRef = document.getElementById('filtro-mes').value;
        const query = document.getElementById('search-input').value.toUpperCase();
        
        document.getElementById('header-mes-atual').innerText = formatarMesDisplay(mesRef);
        
        const filtrados = masterData.filter(d => d.mes === mesRef && d.nome.includes(query));
        const todosDoMes = masterData.filter(d => d.mes === mesRef);

        const maxVal = todosDoMes.length > 0 ? Math.max(...todosDoMes.map(o => o.registros || 0)) : 0;

        const t = {
            reg: todosDoMes.reduce((s,e) => s+(e.registros||0),0),
            sms: todosDoMes.reduce((s,e) => s+(e.sms||0),0),
            email: todosDoMes.reduce((s,e) => s+(e.email||0),0),
            wpp: todosDoMes.reduce((s,e) => s+(e.whatsapp||0),0),
            cart: todosDoMes.reduce((s,e) => s+(e.cartas||0),0)
        };

        document.getElementById('total-registros').innerText = t.reg.toLocaleString();
        document.getElementById('total-sms').innerText = t.sms.toLocaleString();
        document.getElementById('total-email').innerText = t.email.toLocaleString();
        document.getElementById('total-whatsapp').innerText = t.wpp.toLocaleString();
        document.getElementById('total-cartas').innerText = t.cart.toLocaleString();

        document.getElementById('tabela-corpo').innerHTML = filtrados.map(e => {
            const isLider = e.registros === maxVal && maxVal > 0;
            return `
            <tr class="${isLider ? 'highlight-row' : ''} hover:bg-gray-50/50">
                <td class="px-8 py-4 font-bold">
                    ${e.nome}
                    ${isLider ? '<span class="ml-2 px-2 py-0.5 bg-green-500 text-white text-[8px] rounded-full uppercase">Líder Volume</span>' : ''}
                </td>
                <td class="px-6 py-4 text-center font-bold">${(e.registros||0).toLocaleString()}</td>
                <td class="px-6 py-4 text-center text-slate-400">${(e.sms||0).toLocaleString()}</td>
                <td class="px-6 py-4 text-center text-green-600 font-medium">${(e.whatsapp||0).toLocaleString()}</td>
                <td class="px-6 py-4 text-center text-slate-400">${(e.email||0).toLocaleString()}</td>
                <td class="px-8 py-4 text-right"><div class="w-2 h-2 rounded-full bg-slate-200 ml-auto"></div></td>
            </tr>`;
        }).join('');

        const ranking = [...todosDoMes].sort((a,b) => (b.registros||0) - (a.registros||0)).slice(0,5);
        document.getElementById('ranking-list').innerHTML = ranking.map((e,i) => `
            <div class="flex items-center justify-between border-b border-gray-50 pb-2">
                <span class="text-xs font-bold">${i+1}º ${e.nome}</span>
                <span class="text-xs font-black text-camec-gold">${(e.registros||0).toLocaleString()}</span>
            </div>`).join('');

        document.getElementById('admin-list').innerHTML = masterData.sort((a,b)=>a.nome.localeCompare(b.nome)).map(e => `
            <div class="p-4 bg-white border rounded-xl flex justify-between items-center hover:border-camec-gold transition-all">
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-slate-300 uppercase">${formatarMesDisplay(e.mes)}</span>
                    <span class="font-bold text-xs">${e.nome}</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="prepararEdicao('${e.id}')" class="w-8 h-8 flex items-center justify-center bg-amber-50 text-amber-600 rounded-lg hover:bg-amber-100"><i class="fas fa-edit text-xs"></i></button>
                    <button onclick="excluir('${e.id}')" class="w-8 h-8 flex items-center justify-center bg-red-50 text-red-400 rounded-lg hover:bg-red-100"><i class="fas fa-trash-alt text-xs"></i></button>
                </div>
            </div>`).join('');

        atualizarGrafico(t);
    };

    const atualizarGrafico = (t) => {
        const ctx = document.getElementById('chartPrincipal').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['SMS', 'WhatsApp', 'E-mail', 'Cartas'],
                datasets: [{
                    data: [t.sms, t.wpp, t.email, t.cart],
                    backgroundColor: ['#3d2b1f', '#22c55e', '#a16d2a', '#e2e8f0'],
                    borderRadius: 6, barThickness: 40
                }]
            },
            options: { 
                maintainAspectRatio: false, 
                plugins: { legend: { display: false } },
                scales: { y: { grid: { display: false }, border: { display: false } }, x: { grid: { display: false } } }
            }
        });
    };

    window.salvar = async () => {
        const idEdit = document.getElementById('edit-id').value;
        const nome = document.getElementById('in-empresa').value.trim().toUpperCase();
        const mes = document.getElementById('in-mes').value;
        if(!nome) return;

        const docId = idEdit || `${mes}_${nome}`;
        const data = {
            id: docId, nome, mes,
            registros: parseInt(document.getElementById('in-registros').value) || 0,
            sms: parseInt(document.getElementById('in-sms').value) || 0,
            email: parseInt(document.getElementById('in-email').value) || 0,
            whatsapp: parseInt(document.getElementById('in-wpp').value) || 0,
            cartas: parseInt(document.getElementById('in-cartas').value) || 0
        };

        await setDoc(doc(db, "producao_mensal", docId), data, { merge: true });
        Swal.fire('Sucesso', 'Base atualizada!', 'success');
        cancelarEdicao();
    };

    window.prepararEdicao = (id) => {
        const obj = masterData.find(d => d.id === id);
        document.getElementById('edit-id').value = obj.id;
        document.getElementById('in-empresa').value = obj.nome;
        document.getElementById('in-mes').value = obj.mes;
        document.getElementById('in-registros').value = obj.registros;
        document.getElementById('in-sms').value = obj.sms;
        document.getElementById('in-email').value = obj.email;
        document.getElementById('in-wpp').value = obj.whatsapp;
        document.getElementById('in-cartas').value = obj.cartas;
        
        document.getElementById('form-title').innerText = "✏️ Editando Registro";
        document.getElementById('btn-salvar').innerText = "Atualizar Agora";
        document.getElementById('btn-cancel').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.cancelarEdicao = () => {
        document.getElementById('edit-id').value = "";
        document.querySelectorAll('#admin-panel input').forEach(i => i.value = "");
        document.getElementById('form-title').innerText = "Novo Lançamento";
        document.getElementById('btn-salvar').innerText = "Gravar Dados";
        document.getElementById('btn-cancel').classList.add('hidden');
    };

    window.excluir = async (id) => {
        const confirm = await Swal.fire({ title: 'Remover?', icon: 'warning', showCancelButton: true });
        if(confirm.isConfirmed) await deleteDoc(doc(db, "producao_mensal", id));
    };

    window.exportToExcel = () => {
        const mes = document.getElementById('filtro-mes').value;
        const dados = masterData.filter(d => d.mes === mes).map(e => ({
            Empresa: e.nome,
            Registros: e.registros,
            SMS: e.sms,
            WhatsApp: e.whatsapp,
            Email: e.email,
            Cartas: e.cartas
        }));
        const ws = XLSX.utils.json_to_sheet(dados);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Produção");
        XLSX.writeFile(wb, `CAMEC_PROD_${mes}.xlsx`);
    };

    window.exportToPDF = () => {
        const { jsPDF } = window.jspdf;
        const docPDF = new jsPDF('p', 'pt', 'a4');
        const mes = document.getElementById('filtro-mes').value;
        const filtrados = masterData.filter(d => d.mes === mes);

        docPDF.setFillColor(61, 43, 31);
        docPDF.rect(0, 0, 600, 60, 'F');
        docPDF.setTextColor(255);
        docPDF.setFontSize(16);
        docPDF.text("RELATÓRIO DE PRODUÇÃO CAMEC", 40, 38);
        
        const body = filtrados.map(e => [e.nome, e.registros, e.sms, e.whatsapp, e.email]);
        docPDF.autoTable({
            startY: 100,
            head: [['EMPRESA', 'REGISTROS', 'SMS', 'WPP', 'EMAIL']],
            body: body,
            headStyles: { fillColor: [161, 109, 42] },
            theme: 'grid'
        });
        docPDF.save(`RELATORIO_${mes}.pdf`);
    };

    const init = () => {
        const sF = document.getElementById('filtro-mes');
        const sI = document.getElementById('in-mes');
        
        // Mapeamento de opções com exibição correta de "Março"
        const opts = PERIODOS.map(p => {
            return `<option value="${p}">${formatarMesDisplay(p)}</option>`;
        }).join('');
        
        sF.innerHTML = opts; 
        sI.innerHTML = opts;
        
        onSnapshot(collection(db, "producao_mensal"), (snap) => {
            masterData = [];
            snap.forEach(d => masterData.push(d.data()));
            renderizarDashboard();
        });
    };

    init();
</script>
</body>
</html>
