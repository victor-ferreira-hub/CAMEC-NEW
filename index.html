<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Pro - CAMEC</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2ecc71; --dark: #2c3e50; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        nav button { background: none; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; color: #7f8c8d; }
        nav button.active { color: var(--dark); border-bottom: 3px solid var(--primary); }
        .view { display: none; }
        .view.active { display: block; }
        .admin-lock { text-align: center; padding: 40px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 8px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; flex: 1; }
        button { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-main { background: var(--primary); color: white; }
        .btn-del { background: var(--danger); color: white; padding: 5px 12px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #eee; }
        th { background: #fafafa; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #fff; padding: 20px; border: 1px solid #eee; border-radius: 8px; text-align: center; }
        .big-number { font-size: 2em; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <button onclick="window.switchView('dashboard')" id="btn-dash" class="active">📊 Dashboard</button>
        <button onclick="window.switchView('admin')" id="btn-admin">⚙️ Admin</button>
    </nav>

    <div id="view-dashboard" class="view active">
        <div class="stats-grid">
            <div class="card">
                <p>Total de Registros (Mês)</p>
                <div class="big-number" id="total-geral">0</div>
            </div>
            <div class="card">
                <p>Empresas Ativas</p>
                <div class="big-number" id="total-empresas">0</div>
            </div>
        </div>
        <div style="margin-top: 30px;">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <div id="view-admin" class="view">
        <div id="admin-auth" class="admin-lock">
            <h3>🔒 Área Restrita</h3>
            <input type="password" id="pass-input" placeholder="Digite a senha admin">
            <button class="btn-main" onclick="window.checkPass()">Entrar</button>
        </div>

        <div id="admin-content" style="display: none;">
            <div class="form-group">
                <input type="text" id="input-empresa" placeholder="Nome da Empresa">
                <input type="number" id="input-registros" placeholder="Qtd Registros">
                <button class="btn-main" onclick="window.salvarDados()">Lançar Registro</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Empresa</th>
                        <th>Total Acumulado</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // DADOS DA SUA FOTO (Confira se estão idênticos!)
    const firebaseConfig = {
        apiKey: "AIzaSyCzIG5TaDEH2R-f7GtJRiTi_Jxt1aiPiqY", 
        authDomain: "camec-6a988.firebaseapp.com",
        projectId: "camec-6a988",
        storageBucket: "camec-6a988.appspot.com",
        messagingSenderId: "37119733437",
        appId: "1:37119733437:web:49241324e93e303e30a5d2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let myChart = null;

    // Funções globais para o HTML conseguir ler
    window.switchView = (view) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
        document.getElementById('btn-' + view).classList.add('active');
    };

    window.checkPass = () => {
        if(document.getElementById('pass-input').value === '1234') {
            document.getElementById('admin-auth').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
        } else { alert("Senha incorreta!"); }
    };

    window.salvarDados = async () => {
        const nome = document.getElementById('input-empresa').value.trim().toUpperCase();
        const qtd = parseInt(document.getElementById('input-registros').value);
        if(!nome || isNaN(qtd)) return alert("Preencha corretamente!");

        try {
            const querySnapshot = await getDocs(collection(db, "empresas"));
            let totalAtual = 0;
            querySnapshot.forEach((d) => { if(d.id === nome) totalAtual = d.data().total || 0; });

            await setDoc(doc(db, "empresas", nome), { nome: nome, total: totalAtual + qtd });
            document.getElementById('input-empresa').value = '';
            document.getElementById('input-registros').value = '';
        } catch (e) { alert("Erro ao salvar! Verifique as Regras no Firebase."); }
    };

    window.excluir = async (id) => {
        if(confirm("Deseja zerar esta empresa?")) await deleteDoc(doc(db, "empresas", id));
    };

    // Monitorar dados
    onSnapshot(collection(db, "empresas"), (snapshot) => {
        const empresas = [];
        snapshot.forEach(doc => empresas.push(doc.data()));
        
        const corpo = document.getElementById('tabela-corpo');
        corpo.innerHTML = '';
        empresas.forEach(emp => {
            corpo.innerHTML += `<tr><td><strong>${emp.nome}</strong></td><td>${emp.total}</td><td><button class="btn-del" onclick="window.excluir('${emp.nome}')">Zerar/Excluir</button></td></tr>`;
        });

        document.getElementById('total-geral').innerText = empresas.reduce((sum, emp) => sum + emp.total, 0);
        document.getElementById('total-empresas').innerText = empresas.length;

        const ctx = document.getElementById('myChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: empresas.map(e => e.nome),
                datasets: [{ label: 'Registros', data: empresas.map(e => e.total), backgroundColor: '#2ecc71' }]
            }
        });
    });
</script>
</body>
</html>
